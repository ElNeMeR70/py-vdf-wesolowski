[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-vdf-wesolowski"
version = "1.0.0"
description = "Verifiable Delay Function (Wesolowski construction)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "vdf", "verifiable-delay", "cryptography", "blockchain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-vdf-wesolowski"
Repository = "https://github.com/ElNeMeR70/py-vdf-wesolowski"
